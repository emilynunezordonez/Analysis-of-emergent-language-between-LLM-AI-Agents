# Real model, unconstrained baseline. Needs a GPU and requirements-model.txt.
# Tx and Rx share one Qwen2.5-VL instance (same weights, same tokenizer).
experiment: {name: qwen-baseline, output_dir: runs/qwen_baseline, seeds: [0, 1, 2], rounds: 1}
dataset: {data_dir: data}
backend: {type: qwen, model_id: Qwen/Qwen2.5-VL-3B-Instruct, device_map: auto, torch_dtype: auto}
tx:
  modes: [llm_free, natural_language, json, vector]
  extractor: backend          # template modes: the VLM extracts attributes; use ground_truth for the oracle baseline
  inform_budget: true
  generation: {temperature: 0.7, top_p: 0.9, max_new_tokens: 256}
rx: {max_retries: 2, generation: {temperature: 0.0, max_new_tokens: 256}}
channel: {token_budgets: [null], noise: {name: identity}}
memory: {enabled: [false]}
evaluation: {llm_judge: false}
