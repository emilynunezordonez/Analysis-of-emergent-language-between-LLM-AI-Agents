[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "information-theoretic-transmitter"
version = "0.1.0"
description = "Noiseless transmitter baseline for geometric-image communication experiments"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]
model = ["torch>=2.2", "transformers>=4.49", "qwen-vl-utils>=0.0.10"]
test = ["pytest>=8.0"]

[project.scripts]
tx-run = "transmitter.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
